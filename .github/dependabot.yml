# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# How this works:
# - Security updates (a known advisory) are separate from version updates. They are switched on in the
#   repository settings (Settings > Advanced Security > "Dependabot security updates"). `cooldown` and
#   `groups` below apply to version updates only; labels and the commit message prefix apply to both.
# - Version updates (routine "a newer release exists"): weekly, grouped, and only for releases at least
#   14 days old.
# - This app can be deployed straight onto the live show machine, so merge Dependabot PRs only when the
#   CI check is green and the show is not running.

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    # Only propose releases that have been out for two weeks (supply-chain precaution).
    # Not applied to security updates.
    cooldown:
      default-days: 14
    groups:
      # eslint-config-next is released in step with next (same version number), so they move together
      next-framework:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      # react and react-dom must have the same version (react-dom requires that exact react)
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      # One PR for the everyday minor/patch bumps. The packages listed under exclude-patterns
      # are the ones that can break the show, so each of them gets its own PR instead.
      routine-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "better-sqlite3"
          - "next-auth"
          - "sharp"
          - "nodemailer"
          - "@types/*"
          - "eslint*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      # Types, linting and the compiler never run in production; one PR for all of them
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
        exclude-patterns:
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions (keep workflows up to date)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
