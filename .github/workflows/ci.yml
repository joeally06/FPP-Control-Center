name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Security Checks
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: testsecret
          NEXTAUTH_URL: https://example.local
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
        run: node -r esbuild-register scripts/check-security.js

      - name: Lint
        run: npm run lint

      # The build loads route modules that need the schema; this creates a throwaway
      # votes.db on the runner, as `npm run setup` does on a fresh install
      - name: Initialize database
        run: node scripts/init-database.js

      - name: Build
        env:
          NODE_ENV: production
          # Placeholder for the build only; must pass the app's secret-strength check
          NEXTAUTH_SECRET: ci-build-placeholder-NOT-A-REAL-SECRET-0123456789
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          SMTP_AUTH_USER: test
          SMTP_AUTH_PASS: test
        run: npm run build

      - name: Run tests
        run: npm run test:ci
